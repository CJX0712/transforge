[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transforge"
version = "0.1.0"
description = "Verified optimal-transport solver bench: automatic regularisation-strength selection with checkable invariants"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "晨星 (CJX0712)" }]
keywords = ["optimal-transport", "sinkhorn", "unbalanced-ot", "benchmark", "reproducibility"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "POT>=0.9.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/CJX0712/transforge"
Repository = "https://github.com/CJX0712/transforge"
Changelog = "https://github.com/CJX0712/transforge/blob/main/CHANGELOG.md"

[project.scripts]
transforge = "transforge.cli:main"

[tool.setuptools.packages.find]
include = ["transforge*"]

# ---- REQUIRED: without pythonpath=["."] CI fails with ModuleNotFoundError ----
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "gate: multi-axis gate regression tests (G1-G4)",
  "invariant: cross-validation invariant tests (I1-I10)",
  "slow: tests taking more than 10 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"transforge/core/config.py" = ["E501"]

[tool.coverage.run]
source = ["transforge"]
omit = ["*/tests/*"]

# NOTE: gate thresholds live in transforge/core/config.py (GATES) so that code,
# tests and docs all read one source of truth. Do NOT duplicate them here.